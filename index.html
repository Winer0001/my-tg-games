<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровая Панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #181818;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #f39c12;
        }
        .subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .game-card {
            background-color: #242424;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }
        .game-info h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }
        .game-info p {
            margin: 0;
            font-size: 12px;
            color: #2ecc71;
        }
        .play-btn {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Стили для игрового экрана, который будет перекрывать меню */
        #game-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #181818;
            z-index: 100;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
        }
        .close-btn {
            width: 100%;
            height: 50px;
            background-color: #e74c3c;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="menu-container">
        <h1>🎮 ИГРОВАЯ ТЕКА</h1>
        <div class="subtitle">Выбирай игру и зарабатывай монеты!</div>

        <div class="game-card">
            <div class="game-info">
                <h2>♟ Шахматы</h2>
                <p>Награда: +50 🪙 за победу</p>
            </div>
            <button class="play-btn" onclick="playGame('chess')">Играть</button>
        </div>

        <div class="game-card">
            <div class="game-info">
                <h2>🔴 Шашки</h2>
                <p>Награда: +30 🪙 за победу</p>
            </div>
            <button class="play-btn" onclick="playGame('checkers')">Играть</button>
        </div>

        <div class="game-card">
            <div class="game-info">
                <h2>🎲 Нарды</h2>
                <p>Награда: +40 🪙 за победу</p>
            </div>
            <button class="play-btn" onclick="playGame('backgammon')">Играть</button>
        </div>
    </div>

    <div id="game-container">
        <button class="close-btn" onclick="closeGame()">❌ Выйти в меню</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function playGame(gameType) {
            let gameUrl = "";
            
            if (gameType === 'checkers') {
                // Подключаем бесплатные качественные веб-шашки
                gameUrl = "https://html5.gamedistribution.com/66a935b5a2bf4e858dfdf87ca863e414/";
            } else if (gameType === 'chess') {
                // Подключаем бесплатные шахматы
                gameUrl = "https://html5.gamedistribution.com/894f06dfb18e47269f886f345842813a/";
            } else if (gameType === 'backgammon') {
                // Подключаем нарды
                gameUrl = "https://html5.gamedistribution.com/568858f96e474533a18a99477e68fa9f/";
            }

            // Показываем контейнер игры и скрываем меню
            document.getElementById('game-frame').src = gameUrl;
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('menu-container').style.display = 'none';
        }

        function closeGame() {
            // Закрываем игру и возвращаем меню
            document.getElementById('game-frame').src = "";
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('menu-container').style.display = 'block';
            
            // Здесь в будущем мы сделаем начисление монет!
            tg.sendData("game_finished"); 
        }
    </script>
</body>
</html>
