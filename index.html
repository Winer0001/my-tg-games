<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Игровая Панель — Настоящие Шашки с ИИ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #181818;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { font-size: 24px; margin-bottom: 5px; color: #f39c12; }
        .subtitle { color: #aaaaaa; margin-bottom: 25px; font-size: 14px; }
        
        .game-card {
            background-color: #242424; border-radius: 12px; width: 100%; max-width: 350px;
            padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #333;
            box-sizing: border-box;
        }
        .game-info h2 { margin: 0 0 5px 0; font-size: 18px; }
        .game-info p { margin: 0; font-size: 12px; color: #2ecc71; }
        .play-btn {
            background-color: #f39c12; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        
        /* ЖЕСТКИЙ КОНТЕЙНЕР ИГРЫ — БЕЗ СКАЧКОВ И СДВИГОВ */
        #game-container {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background-color: #1a1a1a; 
            z-index: 100; 
            flex-direction: column; 
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
            overflow: hidden;
        }
        .close-btn {
            width: 100%; height: 50px; background-color: #e74c3c; color: white;
            border: none; font-size: 16px; font-weight: bold; cursor: pointer;
            flex-shrink: 0;
        }
        
        .status-bar {
            margin-top: 20px; font-size: 18px; font-weight: bold; color: #f1c40f;
            text-align: center; height: 24px; line-height: 24px; flex-shrink: 0;
        }

        /* ИГРОВОЕ ПОЛЕ — СТРОГИЙ ЖЕЛЕЗОБЕТОННЫЙ ФИКСИРОВАННЫЙ РАЗМЕР */
        .board {
            display: grid; 
            grid-template-columns: repeat(8, 1fr);
            width: 330px;        /* Строго заданная ширина в пикселях */
            height: 330px;       /* Строго заданная высота в пикселях */
            margin-top: 20px; 
            border: 4px solid #333; 
            background-color: #b58863;
            box-sizing: border-box;
            flex-shrink: 0;      /* Запрещает браузеру сжимать или деформировать доску */
        }
        
        .cell {
            display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;
            box-sizing: border-box; cursor: pointer;
        }
        .white-cell { background-color: #f0d9b5; }
        .black-cell { background-color: #b58863; }
        .selected-cell { border: 3px solid #2ecc71 !important; }
        
        /* ШАШКИ — ИДЕАЛЬНЫЙ КРУГ ИЗ-ЗА ЖЕСТКИХ РАЗМЕРОВ КЛЕТКИ */
        .checker {
            width: 80%; height: 80%; border-radius: 50%;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.4);
            pointer-events: none;
            box-sizing: border-box;
        }
        .white-checker { background-color: #ffffff; border: 2px solid #ccc; }
        .black-checker { background-color: #222222; border: 2px solid #000; }
        
        /* СТИЛЬ ДЛЯ ДАМКИ */
        .king {
            border: 4px solid #f1c40f !important;
            box-shadow: 0 0 10px #f1c40f, inset 0 0 8px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menu-container">
        <h1>🎮 ИГРОВАЯ ТЕКА</h1>
        <div class="subtitle">Выбирай игру и зарабатывай монеты!</div>

        <div class="game-card">
            <div class="game-info">
                <h2>🔴 Шашки с ИИ</h2>
                <p>Награда: +30 🪙 за победу</p>
            </div>
            <button class="play-btn" onclick="startCheckers()">Играть</button>
        </div>

        <div class="game-card" style="opacity: 0.5;">
            <div class="game-info">
                <h2>♟ Шахматы</h2>
                <p>В разработке...</p>
            </div>
            <button class="play-btn" style="background-color: #555;" disabled>Ожидание</button>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game-container">
        <button class="close-btn" onclick="exitGameWithoutReward()">❌ Выйти без награды</button>
        <div class="status-bar" id="game-status">Ход Бевых</div>
        <div class="board" id="checker-board"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedCell = null;
        let currentTurn = 'white'; 
        let gameOver = false;

        function startCheckers() {
            gameOver = false;
            currentTurn = 'white';
            document.getElementById('game-status').innerText = "Твой ход (Белые)";
            document.getElementById('menu-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            
            const board = document.getElementById('checker-board');
            board.innerHTML = ''; 
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    const isBlackCell = (row + col) % 2 === 1;
                    
                    cell.className = 'cell ' + (isBlackCell ? 'black-cell' : 'white-cell');
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    if (isBlackCell && row < 3) {
                        const checker = document.createElement('div');
                        checker.className = 'checker black-checker';
                        checker.dataset.color = 'black';
                        checker.dataset.isKing = 'false';
                        cell.appendChild(checker);
                    } else if (isBlackCell && row > 4) {
                        const checker = document.createElement('div');
                        checker.className = 'checker white-checker';
                        checker.dataset.color = 'white';
                        checker.dataset.isKing = 'false';
                        cell.appendChild(checker);
                    }
                    
                    cell.addEventListener('click', onCellClick);
                    board.appendChild(cell);
                }
            }
        }

        function onCellClick(event) {
            if (gameOver || currentTurn === 'black') return;

            const cell = event.currentTarget;
            const checker = cell.querySelector('.checker');

            if (!selectedCell) {
                if (checker && checker.dataset.color === 'white') {
                    selectedCell = cell;
                    cell.classList.add('selected-cell');
                }
            } else {
                if (selectedCell === cell) {
                    selectedCell.classList.remove('selected-cell');
                    selectedCell = null;
                    return;
                }

                if (!checker && cell.classList.contains('black-cell')) {
                    const move = validateMove(selectedCell, cell, 'white');
                    
                    if (move.isValid) {
                        executeMove(selectedCell, cell, move.scannedEnemyCell);
                        selectedCell.classList.remove('selected-cell');
                        selectedCell = null;

                        if (!checkWinCondition()) {
                            currentTurn = 'black';
                            document.getElementById('game-status').innerText = "🤖 Компьютер думает...";
                            setTimeout(makeAiMove, 600);
                        }
                    }
                } else if (checker && checker.dataset.color === 'white') {
                    selectedCell.classList.remove('selected-cell');
                    selectedCell = cell;
                    cell.classList.add('selected-cell');
                }
            }
        }

        function validateMove(fromCell, toCell, color) {
            const fromRow = parseInt(fromCell.dataset.row);
            const fromCol = parseInt(fromCell.dataset.col);
            const toRow = parseInt(toCell.dataset.row);
            const toCol = parseInt(toCell.dataset.col);
            const checker = fromCell.querySelector('.checker');
            const isKing = checker.dataset.isKing === 'true';

            const rowDiff = toRow - fromRow;
            const colDiff = Math.abs(toCol - fromCol);

            if (colDiff === 1) {
                if (isKing && Math.abs(rowDiff) === 1) return { isValid: true, scannedEnemyCell: null };
                if (!isKing) {
                    if (color === 'white' && rowDiff === -1) return { isValid: true, scannedEnemyCell: null };
                    if (color === 'black' && rowDiff === 1) return { isValid: true, scannedEnemyCell: null };
                }
            }

            if (Math.abs(rowDiff) === 2 && colDiff === 2) {
                const midRow = (fromRow + toRow) / 2;
                const midCol = (fromCol + toCol) / 2;
                const midCell = document.querySelector(`[data-row='${midRow}'][data-col='${midCol}']`);
                const midChecker = midCell ? midCell.querySelector('.checker') : null;

                if (midChecker && midChecker.dataset.color !== color) {
                    return { isValid: true, scannedEnemyCell: midCell };
                }
            }

            return { isValid: false, scannedEnemyCell: null };
        }

        function executeMove(fromCell, toCell, enemyCellToDelete) {
            const movingChecker = fromCell.querySelector('.checker');
            
            if (enemyCellToDelete) {
                const victim = enemyCellToDelete.querySelector('.checker');
                if (victim) enemyCellToDelete.removeChild(victim);
            }

            toCell.appendChild(movingChecker);

            const toRow = parseInt(toCell.dataset.row);
            if (movingChecker.dataset.color === 'white' && toRow === 0) {
                movingChecker.dataset.isKing = 'true';
                movingChecker.classList.add('king');
            }
            if (movingChecker.dataset.color === 'black' && toRow === 7) {
                movingChecker.dataset.isKing = 'true';
                movingChecker.classList.add('king');
            }
        }

        function makeAiMove() {
            if (gameOver) return;

            const blackCellsWithCheckers = Array.from(document.querySelectorAll('.cell .black-checker')).map(el => el.parentElement);
            const allEmptyCells = Array.from(document.querySelectorAll('.cell.black-cell')).filter(el => !el.querySelector('.checker'));

            let possibleEatMoves = [];
            let possibleNormalMoves = [];

            for (let fromCell of blackCellsWithCheckers) {
                for (let toCell of allEmptyCells) {
                    const move = validateMove(fromCell, toCell, 'black');
                    if (move.isValid) {
                        if (move.scannedEnemyCell) {
                            possibleEatMoves.push({ from: fromCell, to: toCell, enemy: move.scannedEnemyCell });
                        } else {
                            possibleNormalMoves.push({ from: fromCell, to: toCell, enemy: null });
                        }
                    }
                }
            }

            if (possibleEatMoves.length > 0) {
                const finalMove = possibleEatMoves[Math.floor(Math.random() * possibleEatMoves.length)];
                executeMove(finalMove.from, finalMove.to, finalMove.enemy);
            } else if (possibleNormalMoves.length > 0) {
                const finalMove = possibleNormalMoves[Math.floor(Math.random() * possibleNormalMoves.length)];
                executeMove(finalMove.from, finalMove.to, null);
            }

            if (!checkWinCondition()) {
                currentTurn = 'white';
                document.getElementById('game-status').innerText = "Твой ход (Белые)";
            }
        }

        function checkWinCondition() {
            const whiteCheckers = document.querySelectorAll('.white-checker');
            const blackCheckers = document.querySelectorAll('.black-checker');

            if (whiteCheckers.length === 0) {
                endGame('black');
                return true;
            } else if (blackCheckers.length === 0) {
                endGame('white');
                return true;
            }
            return false;
        }

        function endGame(winner) {
            gameOver = true;
            if (winner === 'white') {
                document.getElementById('game-status').innerText = "🎉 ПОБЕДА! +30 Монет твои!";
                alert("Ты обыграл компьютер! Забирай свои монеты!");
                setTimeout(() => {
                    tg.sendData("game_finished");
                    tg.close();
                }, 1000);
            } else {
                document.getElementById('game-status').innerText = "💀 ИИ выиграл. Попробуй еще раз!";
                alert("Вы проиграли компьютеру. Монеты не начислены.");
                setTimeout(() => {
                    document.getElementById('game-container').style.display = 'none';
                    document.getElementById('menu-container').style.display = 'block';
                    tg.close();
                }, 1000);
            }
        }

        function exitGameWithoutReward() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('menu-container').style.display = 'block';
            tg.close();
        }
    </script>
</body>
</html>
