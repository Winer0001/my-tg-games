<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Игровая Панель — Настоящие Шашки с ИИ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #181818;
        color: #ffffff;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
        user-select: none;
    }
    h1 { font-size: 24px; margin-bottom: 5px; color: #f39c12; }
    .subtitle { color: #aaaaaa; margin-bottom: 25px; font-size: 14px; }

    .game-card {
        background-color: #242424;
        border-radius: 12px;
        width: 100%;
        max-width: 350px;
        padding: 15px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        border: 1px solid #333;
    }
    .game-info h2 { margin: 0 0 5px 0; font-size: 18px; }
    .game-info p { margin: 0; font-size: 12px; color: #2ecc71; }

    .play-btn {
        background-color: #f39c12;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }

    #game-container {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #1a1a1a;
        z-index: 100;
        overflow: hidden;
    }

    .close-btn {
        width: 100%;
        height: 50px;
        background-color: #e74c3c;
        color: white;
        border: none;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .status-bar {
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        font-size: 18px;
        font-weight: bold;
        color: #f1c40f;
        text-align: center;
        height: 30px;
        line-height: 30px;
    }

    .board {
        position: absolute;
        top: 110px;
        left: 50%;
        transform: translateX(-50%);
        width: 320px;          /* ФИКСИРОВАННЫЙ РАЗМЕР */
        height: 320px;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        border: 6px solid #333;
        background-color: #b58863;
        box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        overflow: hidden;
    }

    .cell {
        width: 40px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        cursor: pointer;
        position: relative;
    }

    .white-cell { background-color: #f0d9b5; }
    .black-cell { background-color: #b58863; }

    .selected-cell {
        border: 3px solid #2ecc71 !important;
        box-shadow: inset 0 0 0 3px rgba(46, 204, 113, 0.3);
    }

    .checker {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        box-shadow: inset 0 0 8px rgba(0,0,0,0.6), 
                    0 4px 8px rgba(0,0,0,0.4);
        pointer-events: none;
        transition: transform 0.2s;
    }

    .white-checker { background-color: #ffffff; border: 3px solid #ddd; }
    .black-checker { background-color: #222222; border: 3px solid #111; }

    .king {
        border: 4px solid #f1c40f !important;
        box-shadow: 0 0 12px #f1c40f, inset 0 0 8px rgba(0,0,0,0.6);
    }
</style>
</head>
<body>
<div id="menu-container">
    <h1>🎮 ИГРОВАЯ ТЕКА</h1>
    <div class="subtitle">Выбирай игру и зарабатывай монеты!</div>
    <div class="game-card">
        <div class="game-info">
            <h2>🔴 Шашки с ИИ</h2>
            <p>Награда: +30 🪙 за победу</p>
        </div>
        <button class="play-btn" onclick="startCheckers()">Играть</button>
    </div>
    <div class="game-card" style="opacity: 0.5;">
        <div class="game-info">
            <h2>♟ Шахматы</h2>
            <p>В разработке...</p>
        </div>
        <button class="play-btn" style="background-color: #555;" disabled>Ожидание</button>
    </div>
</div>

<div id="game-container">
    <button class="close-btn" onclick="exitGameWithoutReward()">❌ Выйти без награды</button>
    <div class="status-bar" id="game-status">Твой ход (Белые)</div>
    <div class="board" id="checker-board"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let selectedCell = null;
let currentTurn = 'white';
let gameOver = false;

function startCheckers() {
    gameOver = false;
    currentTurn = 'white';
    selectedCell = null;

    document.getElementById('game-status').innerText = "Твой ход (Белые)";
    document.getElementById('menu-container').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';

    const board = document.getElementById('checker-board');
    board.innerHTML = '';

    for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
            const cell = document.createElement('div');
            const isBlackCell = (row + col) % 2 === 1;
            
            cell.className = `cell ${isBlackCell ? 'black-cell' : 'white-cell'}`;
            cell.dataset.row = row;
            cell.dataset.col = col;

            // Начальная расстановка
            if (isBlackCell) {
                if (row < 3) {
                    const checker = document.createElement('div');
                    checker.className = 'checker black-checker';
                    checker.dataset.color = 'black';
                    checker.dataset.isKing = 'false';
                    cell.appendChild(checker);
                } else if (row > 4) {
                    const checker = document.createElement('div');
                    checker.className = 'checker white-checker';
                    checker.dataset.color = 'white';
                    checker.dataset.isKing = 'false';
                    cell.appendChild(checker);
                }
            }

            cell.addEventListener('click', onCellClick);
            board.appendChild(cell);
        }
    }
}

function onCellClick(e) {
    if (gameOver || currentTurn === 'black') return;

    const cell = e.currentTarget;
    const checker = cell.querySelector('.checker');

    if (!selectedCell) {
        if (checker && checker.dataset.color === 'white') {
            selectedCell = cell;
            cell.classList.add('selected-cell');
        }
        return;
    }

    // Снять выделение при повторном клике
    if (selectedCell === cell) {
        selectedCell.classList.remove('selected-cell');
        selectedCell = null;
        return;
    }

    // Перевыбор своей шашки
    if (checker && checker.dataset.color === 'white') {
        selectedCell.classList.remove('selected-cell');
        selectedCell = cell;
        cell.classList.add('selected-cell');
        return;
    }

    // Попытка хода
    if (!checker && cell.classList.contains('black-cell')) {
        const move = validateMove(selectedCell, cell, 'white');
        if (move.isValid) {
            executeMove(selectedCell, cell, move.scannedEnemyCell);
            selectedCell.classList.remove('selected-cell');
            selectedCell = null;

            if (!checkWinCondition()) {
                currentTurn = 'black';
                document.getElementById('game-status').innerText = "🤖 Компьютер думает...";
                setTimeout(makeAiMove, 500);
            }
        }
    }
}

function validateMove(fromCell, toCell, color) {
    const fromRow = +fromCell.dataset.row;
    const fromCol = +fromCell.dataset.col;
    const toRow = +toCell.dataset.row;
    const toCol = +toCell.dataset.col;
    
    const checker = fromCell.querySelector('.checker');
    const isKing = checker.dataset.isKing === 'true';
    const rowDiff = toRow - fromRow;
    const colDiff = Math.abs(toCol - fromCol);

    // Простой ход
    if (colDiff === 1 && Math.abs(rowDiff) === 1) {
        if (isKing) return { isValid: true, scannedEnemyCell: null };
        if (color === 'white' && rowDiff === -1) return { isValid: true, scannedEnemyCell: null };
        if (color === 'black' && rowDiff === 1) return { isValid: true, scannedEnemyCell: null };
    }

    // Взятие
    if (colDiff === 2 && Math.abs(rowDiff) === 2) {
        const midRow = (fromRow + toRow) / 2;
        const midCol = (fromCol + toCol) / 2;
        const midCell = document.querySelector(`[data-row="${midRow}"][data-col="${midCol}"]`);
        
        if (midCell) {
            const midChecker = midCell.querySelector('.checker');
            if (midChecker && midChecker.dataset.color !== color) {
                return { isValid: true, scannedEnemyCell: midCell };
            }
        }
    }

    return { isValid: false, scannedEnemyCell: null };
}

function executeMove(fromCell, toCell, enemyCellToDelete) {
    const movingChecker = fromCell.querySelector('.checker');
    
    if (enemyCellToDelete) {
        enemyCellToDelete.innerHTML = '';
    }

    toCell.appendChild(movingChecker);

    // Становится дамкой
    const toRow = +toCell.dataset.row;
    if (movingChecker.dataset.color === 'white' && toRow === 0) {
        movingChecker.dataset.isKing = 'true';
        movingChecker.classList.add('king');
    }
    if (movingChecker.dataset.color === 'black' && toRow === 7) {
        movingChecker.dataset.isKing = 'true';
        movingChecker.classList.add('king');
    }
}

function makeAiMove() {
    if (gameOver) return;

    const blackCheckers = Array.from(document.querySelectorAll('.black-checker')).map(el => el.parentElement);
    const emptyBlackCells = Array.from(document.querySelectorAll('.black-cell')).filter(el => !el.querySelector('.checker'));

    let eatMoves = [];
    let normalMoves = [];

    for (let from of blackCheckers) {
        for (let to of emptyBlackCells) {
            const move = validateMove(from, to, 'black');
            if (move.isValid) {
                if (move.scannedEnemyCell) eatMoves.push({from, to, enemy: move.scannedEnemyCell});
                else normalMoves.push({from, to, enemy: null});
            }
        }
    }

    let chosenMove;
    if (eatMoves.length > 0) {
        chosenMove = eatMoves[Math.floor(Math.random() * eatMoves.length)];
    } else if (normalMoves.length > 0) {
        chosenMove = normalMoves[Math.floor(Math.random() * normalMoves.length)];
    } else {
        currentTurn = 'white';
        document.getElementById('game-status').innerText = "Твой ход (Белые)";
        return;
    }

    executeMove(chosenMove.from, chosenMove.to, chosenMove.enemy);

    if (!checkWinCondition()) {
        currentTurn = 'white';
        document.getElementById('game-status').innerText = "Твой ход (Белые)";
    }
}

function checkWinCondition() {
    const whiteLeft = document.querySelectorAll('.white-checker').length;
    const blackLeft = document.querySelectorAll('.black-checker').length;

    if (whiteLeft === 0) {
        endGame('black');
        return true;
    }
    if (blackLeft === 0) {
        endGame('white');
        return true;
    }
    return false;
}

function endGame(winner) {
    gameOver = true;
    if (winner === 'white') {
        document.getElementById('game-status').innerText = "🎉 ПОБЕДА! +30 Монет!";
        alert("Ты обыграл ИИ! Награда начислена.");
        setTimeout(() => {
            tg.sendData("game_finished");
            tg.close();
        }, 1200);
    } else {
        document.getElementById('game-status').innerText = "💀 ИИ победил";
        alert("Компьютер выиграл. Попробуй ещё раз!");
        setTimeout(() => {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('menu-container').style.display = 'block';
        }, 1000);
    }
}

function exitGameWithoutReward() {
    document.getElementById('game-container').style.display = 'none';
    document.getElementById('menu-container').style.display = 'block';
    tg.close();
}
</script>
</body>
</html>
