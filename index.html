<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Классические Шашки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #1e1e2e, #2a2a3e);
        color: #ffffff;
        margin: 0; padding: 15px;
        display: flex; flex-direction: column; align-items: center;
        min-height: 100vh; box-sizing: border-box;
    }
    h1 { font-size: 28px; margin: 10px 0 8px; color: #ffd700; }
    .subtitle { color: #aaa; margin-bottom: 20px; }

    .game-card {
        background: #25253a;
        border-radius: 16px;
        padding: 20px;
        width: 100%;
        max-width: 360px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    button {
        width: 100%;
        padding: 16px;
        margin: 10px 0;
        font-size: 17px;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        cursor: pointer;
    }

    #game-container {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: #11111f;
        z-index: 100;
    }
    .close-btn {
        width: 100%; height: 55px;
        background: #e74c3c;
        color: white;
        border: none;
        font-size: 17px;
        font-weight: bold;
    }
    .status-bar {
        position: absolute;
        top: 60px;
        width: 100%;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #ffd700;
    }

    .board {
        position: absolute;
        top: 120px;
        left: 50%;
        transform: translateX(-50%);
        width: 320px;
        height: 320px;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        border: 12px solid #3c2f2f;
        border-radius: 8px;
        background: #5c4033;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .cell {
        width: 40px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        position: relative;
    }
    .white-cell { background: #f0d9b5; }
    .black-cell { background: #5c4033; }

    .selected { box-shadow: inset 0 0 0 5px #2ecc71; }
    .capture { box-shadow: inset 0 0 0 5px #e74c3c; }

    .checker {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        box-shadow: 0 5px 12px rgba(0,0,0,0.7),
                    inset 0 4px 8px rgba(255,255,255,0.4);
    }
    .white-checker { background: #ffffff; border: 3px solid #ddd; }
    .black-checker { background: #222222; border: 3px solid #111; }
    .king { border: 4px solid #ffd700; box-shadow: 0 0 12px #ffd700; }
</style>
</head>
<body>

<div id="menu-container">
    <h1>🎮 Классические Шашки</h1>
    <div class="subtitle">Выбери сложность</div>
    <div class="game-card">
        <button onclick="startGame(1)">Лёгкий — 20 🪙</button>
        <button onclick="startGame(2)">Средний — 35 🪙</button>
        <button onclick="startGame(3)">Сложный — 50 🪙</button>
    </div>
</div>

<div id="game-container">
    <button class="close-btn" onclick="exitGame()">❌ Выйти без награды</button>
    <div class="status-bar" id="game-status">Твой ход (Белые)</div>
    <div class="board" id="checker-board"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let boardState = [];
let selected = null;
let currentTurn = 'white';
let gameOver = false;
let difficulty = 2;
let reward = 30;

function startGame(level) {
    difficulty = level;
    reward = level === 1 ? 20 : level === 2 ? 35 : 50;

    gameOver = false;
    currentTurn = 'white';
    selected = null;

    document.getElementById('menu-container').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    document.getElementById('game-status').innerText = "Твой ход (Белые)";

    const boardEl = document.getElementById('checker-board');
    boardEl.innerHTML = '';
    boardState = Array(8).fill().map(() => Array(8).fill(null));

    for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
            const cell = document.createElement('div');
            const isDark = (row + col) % 2 === 1;
            cell.className = `cell ${isDark ? 'black-cell' : 'white-cell'}`;
            cell.dataset.row = row;
            cell.dataset.col = col;

            if (isDark) {
                if (row < 3) createPiece(cell, 'black', row, col);
                else if (row > 4) createPiece(cell, 'white', row, col);
            }
            cell.addEventListener('click', handleClick);
            boardEl.appendChild(cell);
        }
    }
}

function createPiece(cell, color, row, col) {
    const piece = document.createElement('div');
    piece.className = `checker ${color}-checker`;
    piece.dataset.color = color;
    piece.dataset.isKing = 'false';
    cell.appendChild(piece);
    boardState[row][col] = {color, isKing: false};
}

function handleClick(e) {
    if (gameOver || currentTurn === 'black') return;
    const cell = e.currentTarget;
    const row = +cell.dataset.row;
    const col = +cell.dataset.col;

    if (selected) {
        if (selected.row === row && selected.col === col) {
            clearHighlights();
            selected = null;
            return;
        }

        const move = getValidMove(selected.row, selected.col, row, col);
        if (move.valid) {
            executeMove(selected.row, selected.col, row, col, move.captured);
            clearHighlights();
            selected = null;

            if (!checkWin()) {
                currentTurn = 'black';
                document.getElementById('game-status').innerText = "🤖 Компьютер думает...";
                setTimeout(aiMove, 700);
            }
            return;
        }
    }

    const piece = boardState[row][col];
    if (piece && piece.color === 'white') {
        selected = {row, col};
        highlightPossibleMoves(row, col);
    }
}

function getValidMove(fr, fc, tr, tc) {
    const piece = boardState[fr][fc];
    if (!piece) return {valid: false};

    const dx = Math.abs(tc - fc);
    const dy = Math.abs(tr - fr);

    if (dx !== dy || dx === 0) return {valid: false};
    if (boardState[tr][tc]) return {valid: false};

    let captured = [];

    if (dx === 2) {
        const midR = (fr + tr) / 2;
        const midC = (fc + tc) / 2;
        const mid = boardState[midR][midC];
        if (mid && mid.color !== piece.color) {
            captured.push({row: midR, col: midC});
        } else return {valid: false};
    } else if (dx > 2 && piece.isKing) {
        // Длинный ход дамки (упрощённо)
        const capturedPieces = getCapturedAlongLine(fr, fc, tr, tc);
        if (capturedPieces.length > 0) captured = capturedPieces;
        else if (dx !== 1) return {valid: false};
    } else if (dx !== 1) return {valid: false};

    if (!piece.isKing) {
        if (piece.color === 'white' && tr >= fr) return {valid: false};
        if (piece.color === 'black' && tr <= fr) return {valid: false};
    }

    return {valid: true, captured};
}

function getCapturedAlongLine(fr, fc, tr, tc) {
    // Простая версия для дамок
    const captured = [];
    const sr = Math.sign(tr - fr);
    const sc = Math.sign(tc - fc);
    let r = fr + sr, c = fc + sc;
    while (r !== tr || c !== tc) {
        if (boardState[r][c] && boardState[r][c].color !== boardState[fr][fc].color) {
            captured.push({row: r, col: c});
        }
        r += sr; c += sc;
    }
    return captured;
}

function executeMove(fr, fc, tr, tc, captured) {
    const fromCell = getCell(fr, fc);
    const toCell = getCell(tr, tc);
    const pieceEl = fromCell.firstChild;

    // Удаляем съеденные
    captured.forEach(p => {
        const cCell = getCell(p.row, p.col);
        if (cCell.firstChild) cCell.firstChild.remove();
        boardState[p.row][p.col] = null;
    });

    toCell.appendChild(pieceEl);
    boardState[tr][tc] = boardState[fr][fc];
    boardState[fr][fc] = null;

    // Дамка
    if (!boardState[tr][tc].isKing && 
        ((boardState[tr][tc].color === 'white' && tr === 0) || 
         (boardState[tr][tc].color === 'black' && tr === 7))) {
        boardState[tr][tc].isKing = true;
        pieceEl.classList.add('king');
    }
}

function getCell(r, c) {
    return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
}

function highlightPossibleMoves(row, col) {
    clearHighlights();
    getCell(row, col).classList.add('selected');
}

function clearHighlights() {
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected', 'capture'));
}

function aiMove() {
    let best = null;
    let bestScore = -Infinity;

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (!boardState[r][c] || boardState[r][c].color !== 'black') continue;
            for (let tr = 0; tr < 8; tr++) {
                for (let tc = 0; tc < 8; tc++) {
                    const m = getValidMove(r, c, tr, tc);
                    if (m.valid) {
                        let score = m.captured.length * 30;
                        if (difficulty > 1) score += Math.random() * 10;
                        if (difficulty === 3) score += (7 - tr) * 3;
                        if (score > bestScore) {
                            bestScore = score;
                            best = {fr: r, fc: c, tr, tc, captured: m.captured};
                        }
                    }
                }
            }
        }
    }

    if (best) {
        executeMove(best.fr, best.fc, best.tr, best.tc, best.captured);
    }

    if (!checkWin()) {
        currentTurn = 'white';
        document.getElementById('game-status').innerText = "Твой ход (Белые)";
    }
}

function checkWin() {
    let white = 0, black = 0;
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (boardState[r][c]) {
                boardState[r][c].color === 'white' ? white++ : black++;
            }
        }
    }
    if (white === 0) { endGame('black'); return true; }
    if (black === 0) { endGame('white'); return true; }
    return false;
}

function endGame(winner) {
    gameOver = true;
    if (winner === 'white') {
        document.getElementById('game-status').innerText = `🎉 ПОБЕДА! +${reward} 🪙`;
        alert(`Отличная игра! Ты выиграл и получил ${reward} монет!`);
        setTimeout(() => tg.sendData(`win_${reward}`), 1000);
    } else {
        document.getElementById('game-status').innerText = "🤖 ИИ победил";
        alert("Компьютер выиграл эту партию.");
    }
}

function exitGame() {
    document.getElementById('game-container').style.display = 'none';
    document.getElementById('menu-container').style.display = 'block';
}
</script>
</body>
</html>
