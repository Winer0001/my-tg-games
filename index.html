<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровая Панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #181818;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }
        h1 { font-size: 24px; margin-bottom: 5px; color: #f39c12; }
        .subtitle { color: #aaaaaa; margin-bottom: 25px; font-size: 14px; }
        
        .game-card {
            background-color: #242424; border-radius: 12px; width: 100%; max-width: 350px;
            padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #333;
        }
        .game-info h2 { margin: 0 0 5px 0; font-size: 18px; }
        .game-info p { margin: 0; font-size: 12px; color: #2ecc71; }
        .play-btn {
            background-color: #f39c12; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        
        #game-container {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #1a1a1a; z-index: 100; flex-direction: column; align-items: center;
        }
        .close-btn {
            width: 100%; height: 50px; background-color: #e74c3c; color: white;
            border: none; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        
        /* ИГРОВОЕ ПОЛЕ */
        .board {
            display: grid; grid-template-columns: repeat(8, 1fr);
            width: 90vw; max-width: 360px; height: 90vw; max-height: 360px;
            margin-top: 40px; border: 4px solid #333; background-color: #b58863;
        }
        .cell {
            display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;
            box-sizing: border-box; cursor: pointer;
        }
        .white-cell { background-color: #f0d9b5; }
        .black-cell { background-color: #b58863; }
        .selected-cell { border: 3px solid #2ecc71 !important; } /* Подсветка выбранной клетки */
        
        .checker {
            width: 80%; height: 80%; border-radius: 50%;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.4);
            pointer-events: none; /* Чтобы клик проходил сквозь шашку на клетку */
        }
        .white-checker { background-color: #ffffff; border: 2px solid #ccc; }
        .black-checker { background-color: #222222; border: 2px solid #000; }
    </style>
</head>
<body>

    <div id="menu-container">
        <h1>🎮 ИГРОВАЯ ТЕКА</h1>
        <div class="subtitle">Выбирай игру и зарабатывай монеты!</div>

        <div class="game-card">
            <div class="game-info">
                <h2>🔴 Шашки</h2>
                <p>Награда: +30 🪙 за партию</p>
            </div>
            <button class="play-btn" onclick="startCheckers()">Играть</button>
        </div>

        <div class="game-card" style="opacity: 0.5;">
            <div class="game-info">
                <h2>♟ Шахматы</h2>
                <p>Скоро открытие...</p>
            </div>
            <button class="play-btn" style="background-color: #555;" disabled>Ожидание</button>
        </div>
    </div>

    <div id="game-container">
        <button class="close-btn" onclick="closeGame()">❌ Выйти и забрать монеты</button>
        <div class="board" id="checker-board"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedCell = null; // Здесь храним клетку, на которую нажали

        // Логика создания и расстановки шашек
        function startCheckers() {
            document.getElementById('menu-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            
            const board = document.getElementById('checker-board');
            board.innerHTML = ''; 
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    const isBlackCell = (row + col) % 2 === 1;
                    
                    cell.className = 'cell ' + (isBlackCell ? 'black-cell' : 'white-cell');
                    // Запоминаем координаты клетки в её свойствах
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    // Ставим черные шашки сверху
                    if (isBlackCell && row < 3) {
                        const checker = document.createElement('div');
                        checker.className = 'checker black-checker';
                        checker.dataset.color = 'black';
                        cell.appendChild(checker);
                    } 
                    // Ставим белые шашки снизу (это шашки игрока)
                    else if (isBlackCell && row > 4) {
                        const checker = document.createElement('div');
                        checker.className = 'checker white-checker';
                        checker.dataset.color = 'white';
                        cell.appendChild(checker);
                    }
                    
                    // Навешиваем событие клика на каждую клетку
                    cell.addEventListener('click', onCellClick);
                    board.appendChild(cell);
                }
            }
        }

        // Логика кликов по доске
        function onCellClick(event) {
            const cell = event.currentTarget;
            const checker = cell.querySelector('.checker');

            // ЕСЛИ МЫ ЕЩЕ НЕ ВЫБРАЛИ ШАШКУ:
            if (!selectedCell) {
                // Проверяем, есть ли в клетке шашка (и пускай пока можно выбирать любую)
                if (checker) {
                    selectedCell = cell;
                    cell.classList.add('selected-cell'); // Подсвечиваем
                }
            } 
            // ЕСЛИ ШАШКА УЖЕ БЫЛА ВЫБРАНА:
            else {
                // Если кликнули на ту же самую клетку — снимаем выделение
                if (selectedCell === cell) {
                    selectedCell.classList.remove('selected-cell');
                    selectedCell = null;
                    return;
                }

                // Если кликнули на пустую черную клетку — перемещаем шашку туда!
                if (!checker && cell.classList.contains('black-cell')) {
                    const movingChecker = selectedCell.querySelector('.checker');
                    cell.appendChild(movingChecker); // Переносим шашку в новую клетку
                    
                    selectedCell.classList.remove('selected-cell'); // Убираем подсветку со старой
                    selectedCell = null; // Сбрасываем выбор
                } 
                // Если кликнули на другую клетку с шашкой — переключаем выбор на неё
                else if (checker) {
                    selectedCell.classList.remove('selected-cell');
                    selectedCell = cell;
                    cell.classList.add('selected-cell');
                }
            }
        }

        function closeGame() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('menu-container').style.display = 'block';
            
            tg.sendData("game_finished"); 
            tg.close();
        }
    </script>
</body>
</html>
