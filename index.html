<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Классические Шашки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
        color: #ffffff;
        margin: 0; padding: 15px;
        display: flex; flex-direction: column; align-items: center;
        min-height: 100vh; box-sizing: border-box; user-select: none;
    }
    h1 { font-size: 29px; margin: 10px 0 5px; color: #ffd700; text-shadow: 0 0 20px #ffd700; }
    .subtitle { color: #bbb; margin-bottom: 20px; }

    .game-card, .difficulty-card {
        background: linear-gradient(145deg, #242424, #1a1a1a);
        border-radius: 16px; width: 100%; max-width: 360px;
        padding: 18px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        border: 1px solid #555;
    }

    button {
        background: #f39c12; color: white; border: none;
        padding: 14px 28px; border-radius: 12px; font-weight: bold;
        font-size: 16px; cursor: pointer; margin: 8px 0;
        width: 100%;
    }
    button:hover { background: #e08e10; }

    #game-container {
        display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #0a0a0a; z-index: 100; overflow: hidden;
    }
    .close-btn {
        width: 100%; height: 56px; background: #e74c3c; color: white;
        border: none; font-size: 17px; font-weight: bold; cursor: pointer;
    }
    .status-bar {
        position: absolute; top: 58px; left: 0; width: 100%;
        text-align: center; font-size: 21px; font-weight: bold; color: #ffd700;
        text-shadow: 0 0 12px #ffd700;
    }

    .board {
        position: absolute; top: 115px; left: 50%; transform: translateX(-50%);
        width: 324px; height: 324px;
        display: grid; grid-template-columns: repeat(8, 1fr);
        border: 10px solid #3c2f2f; border-radius: 12px;
        background: #5c4033;
        box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 50px rgba(0,0,0,0.7);
    }
    .cell {
        width: 40px; height: 40px;
        display: flex; justify-content: center; align-items: center;
        position: relative; cursor: pointer; transition: all 0.25s;
    }
    .white-cell { background: #f0d9b5; }
    .black-cell { background: #5c4033; }

    .selected { box-shadow: inset 0 0 0 5px #2ecc71; animation: pulse 1s infinite; }
    .possible { box-shadow: inset 0 0 0 4px rgba(46,204,113,0.7); }
    .capture { box-shadow: inset 0 0 0 5px #e74c3c; animation: capturePulse 0.7s infinite; }

    @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:0.75} }
    @keyframes capturePulse { 0%,100% {box-shadow: inset 0 0 0 5px #e74c3c} 50% {box-shadow: inset 0 0 0 7px #ff4757} }

    .checker {
        width: 34px; height: 34px; border-radius: 50%;
        box-shadow: 0 6px 15px rgba(0,0,0,0.8),
                    inset 0 5px 10px rgba(255,255,255,0.5),
                    inset 0 -5px 10px rgba(0,0,0,0.7);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .white-checker { background: radial-gradient(circle at 35% 35%, #fff, #ccc); border: 3px solid #eee; }
    .black-checker { background: radial-gradient(circle at 35% 35%, #444, #111); border: 3px solid #222; }
    .king::after { content: "👑"; font-size: 24px; position: absolute; filter: drop-shadow(0 0 4px gold); }

    .jumping { animation: jump 0.65s ease-in-out forwards; z-index: 20; }
    @keyframes jump {
        0% { transform: scale(1) translateY(0); }
        35% { transform: scale(1.35) translateY(-45px); }
        70% { transform: scale(0.95) translateY(-8px); }
        100% { transform: scale(1) translateY(0); }
    }
    .captured { animation: explode 0.55s forwards; }
    @keyframes explode {
        to { transform: scale(0.1) rotate(25deg); opacity: 0; }
    }
</style>
</head>
<body>

<div id="menu-container">
    <h1>🎮 Классические Шашки</h1>
    <div class="subtitle">Выбери сложность</div>
    
    <div class="difficulty-card">
        <button onclick="startGame(1)">Лёгкий</button>
        <button onclick="startGame(2)">Средний</button>
        <button onclick="startGame(3)">Сложный</button>
    </div>
</div>

<div id="game-container">
    <button class="close-btn" onclick="exitGameWithoutReward()">❌ Выйти без награды</button>
    <div class="status-bar" id="game-status">Твой ход (Белые)</div>
    <div class="board" id="checker-board"></div>
</div>

<canvas id="confetti" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200;display:none;"></canvas>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let boardState = [];
let selected = null;
let currentTurn = 'white';
let gameOver = false;
let difficulty = 2; // 1 - лёгкий, 2 - средний, 3 - сложный
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    
    filter.type = 'lowpass';
    filter.frequency.value = 1200;

    if (type === 'move') {
        osc.frequency.setValueAtTime(680, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(520, audioCtx.currentTime + 0.25);
        gain.gain.value = 0.25;
        osc.type = 'sine';
    } 
    else if (type === 'capture') {
        osc.frequency.setValueAtTime(420, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(180, audioCtx.currentTime + 0.3);
        gain.gain.value = 0.35;
        osc.type = 'triangle';
    } 
    else if (type === 'king') {
        osc.frequency.value = 920;
        gain.gain.value = 0.3;
        osc.type = 'sine';
    } 
    else if (type === 'win') {
        osc.frequency.value = 760;
        gain.gain.value = 0.4;
    }

    osc.start();
    setTimeout(() => osc.stop(), type === 'capture' ? 280 : 220);
}

function createConfetti() {
    const canvas = document.getElementById('confetti');
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const pieces = [];
    for (let i = 0; i < 160; i++) {
        pieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * -canvas.height,
            size: Math.random() * 11 + 7,
            speed: Math.random() * 5 + 4,
            angle: Math.random() * 360,
            color: ['#ffd700', '#2ecc71', '#3498db', '#e74c3c'][Math.floor(Math.random()*4)]
        });
    }
    
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        pieces.forEach(p => {
            p.y += p.speed;
            p.angle += 7;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();
            if (p.y < canvas.height) active = true;
        });
        if (active) requestAnimationFrame(animate);
        else canvas.style.display = 'none';
    }
    animate();
}

function startGame(level) {
    difficulty = level;
    gameOver = false;
    currentTurn = 'white';
    selected = null;

    document.getElementById('menu-container').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    document.getElementById('game-status').innerText = "Твой ход (Белые)";

    const boardEl = document.getElementById('checker-board');
    boardEl.innerHTML = '';
    boardState = Array(8).fill().map(() => Array(8).fill(null));

    for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
            const cell = document.createElement('div');
            const isDark = (row + col) % 2 === 1;
            cell.className = `cell ${isDark ? 'black-cell' : 'white-cell'}`;
            cell.dataset.row = row;
            cell.dataset.col = col;

            if (isDark) {
                if (row < 3) createPiece(cell, 'black', row, col);
                else if (row > 4) createPiece(cell, 'white', row, col);
            }
            cell.addEventListener('click', handleClick);
            boardEl.appendChild(cell);
        }
    }
}

function createPiece(cell, color, row, col) {
    const piece = document.createElement('div');
    piece.className = `checker ${color}-checker`;
    piece.dataset.color = color;
    piece.dataset.isKing = 'false';
    cell.appendChild(piece);
    boardState[row][col] = {color, isKing: false};
}

function handleClick(e) {
    if (gameOver || currentTurn === 'black') return;
    const cell = e.currentTarget;
    const row = +cell.dataset.row;
    const col = +cell.dataset.col;

    if (selected) {
        if (selected.row === row && selected.col === col) {
            clearHighlights();
            selected = null;
            return;
        }

        const move = getValidMove(selected.row, selected.col, row, col);
        if (move.valid) {
            executeMove(selected.row, selected.col, row, col, move.captured);
            clearHighlights();
            selected = null;

            if (!checkWin()) {
                currentTurn = 'black';
                document.getElementById('game-status').innerText = "🤖 Компьютер думает...";
                setTimeout(() => aiMove(), 600);
            }
        }
        return;
    }

    const piece = boardState[row][col];
    if (piece && piece.color === 'white') {
        selected = {row, col};
        highlightPossibleMoves(row, col);
    }
}

function getValidMove(fr, fc, tr, tc) {
    const piece = boardState[fr][fc];
    if (!piece) return {valid: false};
    const dx = Math.abs(tc - fc);
    const dy = Math.abs(tr - fr);

    if (dx !== dy || dx < 1 || dx > 2) return {valid: false};

    const captured = [];
    if (dx === 2) {
        const midR = (fr + tr) / 2;
        const midC = (fc + tc) / 2;
        const midPiece = boardState[midR][midC];
        if (midPiece && midPiece.color !== piece.color) {
            captured.push({row: midR, col: midC});
        } else return {valid: false};
    }

    if (boardState[tr][tc]) return {valid: false};

    // Проверка направления для обычных шашек
    if (!piece.isKing) {
        if (piece.color === 'white' && tr >= fr) return {valid: false};
        if (piece.color === 'black' && tr <= fr) return {valid: false};
    }

    return {valid: true, captured};
}

function executeMove(fr, fc, tr, tc, captured) {
    const fromCell = getCell(fr, fc);
    const toCell = getCell(tr, tc);
    const pieceEl = fromCell.firstChild;

    playSound(captured.length > 0 ? 'capture' : 'move');

    // Удаляем съеденную шашку
    if (captured.length > 0) {
        const cap = captured[0];
        const capCell = getCell(cap.row, cap.col);
        const capEl = capCell.firstChild;
        if (capEl) {
            capEl.classList.add('captured');
            setTimeout(() => {
                boardState[cap.row][cap.col] = null;
                capEl.remove();
            }, 380);
        }
    }

    pieceEl.classList.add('jumping');
    setTimeout(() => {
        toCell.appendChild(pieceEl);
        pieceEl.classList.remove('jumping');

        boardState[tr][tc] = boardState[fr][fc];
        boardState[fr][fc] = null;

        // Превращение в дамку
        if (!boardState[tr][tc].isKing && 
            ((boardState[tr][tc].color === 'white' && tr === 0) || 
             (boardState[tr][tc].color === 'black' && tr === 7))) {
            boardState[tr][tc].isKing = true;
            pieceEl.classList.add('king');
            pieceEl.dataset.isKing = 'true';
            playSound('king');
        }
    }, 450);
}

function getCell(r, c) {
    return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
}

function highlightPossibleMoves(row, col) {
    clearHighlights();
    getCell(row, col).classList.add('selected');
}

function clearHighlights() {
    document.querySelectorAll('.cell').forEach(c => {
        c.classList.remove('selected', 'possible', 'capture');
    });
}

function aiMove() {
    let bestMove = null;
    let bestScore = -Infinity;

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (!boardState[r][c] || boardState[r][c].color !== 'black') continue;

            for (let tr = 0; tr < 8; tr++) {
                for (let tc = 0; tc < 8; tc++) {
                    const m = getValidMove(r, c, tr, tc);
                    if (m.valid) {
                        let score = m.captured.length * 20;
                        if (difficulty >= 2) score += Math.random() * 8;
                        if (difficulty === 3) score += (7 - tr) * 2; // предпочитает продвигаться
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove = {fr: r, fc: c, tr, tc, captured: m.captured};
                        }
                    }
                }
            }
        }
    }

    if (bestMove) {
        executeMove(bestMove.fr, bestMove.fc, bestMove.tr, bestMove.tc, bestMove.captured);
    }

    if (!checkWin()) {
        currentTurn = 'white';
        document.getElementById('game-status').innerText = "Твой ход (Белые)";
    }
}

function checkWin() {
    let white = 0, black = 0;
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (boardState[r][c]) {
                boardState[r][c].color === 'white' ? white++ : black++;
            }
        }
    }
    if (white === 0) { endGame('black'); return true; }
    if (black === 0) { endGame('white'); return true; }
    return false;
}

function endGame(winner) {
    gameOver = true;
    if (winner === 'white') {
        document.getElementById('game-status').innerText = "🎉 ПОБЕДА!";
        playSound('win');
        createConfetti();
        alert("Отличная игра! Ты победил и получил +30 монет!");
        setTimeout(() => tg.sendData("game_finished"), 1200);
    } else {
        document.getElementById('game-status').innerText = "ИИ победил";
        alert("Компьютер оказался сильнее в этот раз.");
    }
}

function exitGameWithoutReward() {
    document.getElementById('game-container').style.display = 'none';
    document.getElementById('menu-container').style.display = 'block';
}
</script>
</body>
</html>
