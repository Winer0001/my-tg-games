<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Шашки Премиум</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
        color: #ffffff;
        margin: 0; padding: 15px;
        display: flex; flex-direction: column; align-items: center;
        min-height: 100vh; box-sizing: border-box; user-select: none;
    }
    h1 { font-size: 29px; margin: 10px 0 5px; color: #ffd700; text-shadow: 0 0 20px #ffd700; }
    .subtitle { color: #bbb; margin-bottom: 20px; }

    .game-card {
        background: linear-gradient(145deg, #242424, #1a1a1a);
        border-radius: 16px; width: 100%; max-width: 360px;
        padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between;
        align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #555;
    }

    #game-container {
        display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #0a0a0a; z-index: 100; overflow: hidden;
    }
    .close-btn {
        width: 100%; height: 56px; background: #e74c3c; color: white;
        border: none; font-size: 17px; font-weight: bold; cursor: pointer;
    }
    .status-bar {
        position: absolute; top: 58px; left: 0; width: 100%;
        text-align: center; font-size: 21px; font-weight: bold; color: #ffd700;
        text-shadow: 0 0 12px #ffd700;
    }

    .board {
        position: absolute; top: 115px; left: 50%; transform: translateX(-50%);
        width: 324px; height: 324px;
        display: grid; grid-template-columns: repeat(8, 1fr);
        border: 10px solid #3c2f2f; border-radius: 12px;
        background: #5c4033;
        box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 50px rgba(0,0,0,0.7);
    }
    .cell {
        width: 40px; height: 40px;
        display: flex; justify-content: center; align-items: center;
        position: relative; cursor: pointer; transition: all 0.25s;
    }
    .white-cell { background: #f0d9b5; }
    .black-cell { background: #5c4033; }

    .selected { box-shadow: inset 0 0 0 5px #2ecc71; animation: pulse 1s infinite; }
    .possible { box-shadow: inset 0 0 0 4px rgba(46,204,113,0.7); }
    .capture { box-shadow: inset 0 0 0 5px #e74c3c; animation: capturePulse 0.7s infinite; }

    @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:0.75} }
    @keyframes capturePulse { 0%,100% {box-shadow: inset 0 0 0 5px #e74c3c} 50% {box-shadow: inset 0 0 0 7px #ff4757} }

    .checker {
        width: 34px; height: 34px; border-radius: 50%;
        box-shadow: 0 6px 15px rgba(0,0,0,0.8),
                    inset 0 5px 10px rgba(255,255,255,0.5),
                    inset 0 -5px 10px rgba(0,0,0,0.7);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex; align-items: center; justify-content: center;
    }
    .white-checker { background: radial-gradient(circle at 35% 35%, #fff, #ccc); border: 3px solid #eee; }
    .black-checker { background: radial-gradient(circle at 35% 35%, #444, #111); border: 3px solid #222; }
    .king::after { content: "👑"; font-size: 24px; position: absolute; filter: drop-shadow(0 0 4px gold); }

    .jumping { animation: jump 0.65s ease-in-out forwards; z-index: 20; }
    @keyframes jump {
        0% { transform: scale(1) translateY(0); }
        35% { transform: scale(1.35) translateY(-45px); }
        70% { transform: scale(0.95) translateY(-8px); }
        100% { transform: scale(1) translateY(0); }
    }

    .captured { animation: explode 0.55s forwards; }
    @keyframes explode {
        to { transform: scale(0.1) rotate(25deg); opacity: 0; }
    }
</style>
</head>
<body>

<div id="menu-container">
    <h1>🎮 ПРЕМИУМ ШАШКИ</h1>
    <div class="subtitle">Русские правила • Красивые анимации</div>
    <div class="game-card">
        <div>
            <h2>🔴 Шашки с ИИ</h2>
            <p>Награда: +30 🪙 за победу</p>
        </div>
        <button onclick="startCheckers()" style="background:#f39c12;color:white;border:none;padding:14px 28px;border-radius:12px;font-weight:bold;cursor:pointer;font-size:16px;">ИГРАТЬ</button>
    </div>
</div>

<div id="game-container">
    <button class="close-btn" onclick="exitGameWithoutReward()">❌ Выйти без награды</button>
    <div class="status-bar" id="game-status">Твой ход (Белые)</div>
    <div class="board" id="checker-board"></div>
</div>

<canvas id="confetti" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200;display:none;"></canvas>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let boardState = [];
let selected = null;
let currentTurn = 'white';
let gameOver = false;
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    
    if (type === 'move') { osc.frequency.value = 520; gain.gain.value = 0.2; osc.type = 'sine'; }
    else if (type === 'capture') { osc.frequency.value = 180; gain.gain.value = 0.4; osc.type = 'sawtooth'; }
    else if (type === 'king') { osc.frequency.value = 880; gain.gain.value = 0.3; }
    else if (type === 'win') { osc.frequency.value = 660; gain.gain.value = 0.5; }
    
    osc.start();
    setTimeout(() => { osc.stop(); }, type === 'capture' ? 120 : 180);
}

function createConfetti() {
    const canvas = document.getElementById('confetti');
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const pieces = [];
    for (let i = 0; i < 180; i++) {
        pieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            size: Math.random() * 12 + 8,
            speed: Math.random() * 6 + 4,
            angle: Math.random() * 360,
            color: ['#ffd700', '#2ecc71', '#e74c3c', '#3498db'][Math.floor(Math.random()*4)]
        });
    }
    
    function animateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        pieces.forEach(p => {
            p.y += p.speed;
            p.angle += 8;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();
            if (p.y < canvas.height + 50) active = true;
        });
        if (active) requestAnimationFrame(animateConfetti);
        else canvas.style.display = 'none';
    }
    animateConfetti();
}

function startCheckers() {
    gameOver = false; currentTurn = 'white'; selected = null;
    document.getElementById('menu-container').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    document.getElementById('game-status').innerText = "Твой ход (Белые)";

    const boardEl = document.getElementById('checker-board');
    boardEl.innerHTML = '';
    boardState = Array(8).fill().map(() => Array(8).fill(null));

    for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
            const cell = document.createElement('div');
            const isDark = (row + col) % 2 === 1;
            cell.className = `cell ${isDark ? 'black-cell' : 'white-cell'}`;
            cell.dataset.row = row; cell.dataset.col = col;

            if (isDark) {
                if (row < 3) createPiece(cell, 'black', row, col);
                else if (row > 4) createPiece(cell, 'white', row, col);
            }
            cell.addEventListener('click', handleClick);
            boardEl.appendChild(cell);
        }
    }
}

function createPiece(cell, color, row, col) {
    const piece = document.createElement('div');
    piece.className = `checker ${color}-checker`;
    piece.dataset.color = color;
    piece.dataset.isKing = 'false';
    cell.appendChild(piece);
    boardState[row][col] = {color, isKing: false};
}

function handleClick(e) {
    if (gameOver || currentTurn === 'black') return;
    const cell = e.currentTarget;
    const row = +cell.dataset.row, col = +cell.dataset.col;

    if (selected) {
        if (selected.row === row && selected.col === col) {
            clearHighlights(); selected = null; return;
        }
        const move = getBestValidMove(selected.row, selected.col, row, col);
        if (move.valid) {
            executeAnimatedMove(selected.row, selected.col, row, col, move.captured);
            clearHighlights(); selected = null;
            if (!checkWin()) {
                currentTurn = 'black';
                document.getElementById('game-status').innerText = "🤖 Компьютер думает...";
                setTimeout(aiMove, 650);
            }
        }
        return;
    }

    const piece = boardState[row][col];
    if (piece && piece.color === 'white') {
        selected = {row, col};
        highlightPossibleMoves(row, col);
    }
}

function getBestValidMove(fromRow, fromCol, toRow, toCol) {
    const piece = boardState[fromRow][fromCol];
    if (!piece) return {valid: false};
    const dx = Math.abs(toCol - fromCol);
    const dy = Math.abs(toRow - fromRow);
    if (dx !== dy || dx < 1) return {valid: false};

    const captured = getCapturedPieces(fromRow, fromCol, toRow, toCol);
    const isValidPath = captured.length === 0 ? dx === 1 : true;
    return {valid: isValidPath && !boardState[toRow][toCol], captured};
}

function getCapturedPieces(fr, fc, tr, tc) {
    const captured = [];
    const sr = Math.sign(tr - fr), sc = Math.sign(tc - fc);
    let r = fr + sr, c = fc + sc;
    while (r !== tr || c !== tc) {
        if (boardState[r][c] && boardState[r][c].color !== boardState[fr][fc].color) {
            captured.push({row: r, col: c});
        }
        r += sr; c += sc;
    }
    return captured;
}

function executeAnimatedMove(fr, fc, tr, tc, captured) {
    const fromCell = getCell(fr, fc);
    const toCell = getCell(tr, tc);
    const pieceEl = fromCell.firstChild;

    playSound(captured.length > 0 ? 'capture' : 'move');

    captured.forEach(p => {
        const capCell = getCell(p.row, p.col);
        const capEl = capCell.firstChild;
        if (capEl) {
            capEl.classList.add('captured');
            setTimeout(() => {
                boardState[p.row][p.col] = null;
                capEl.remove();
            }, 400);
        }
    });

    pieceEl.classList.add('jumping');
    setTimeout(() => {
        toCell.appendChild(pieceEl);
        pieceEl.classList.remove('jumping');

        boardState[tr][tc] = boardState[fr][fc];
        boardState[fr][fc] = null;

        if (!boardState[tr][tc].isKing && 
            ((boardState[tr][tc].color === 'white' && tr === 0) || 
             (boardState[tr][tc].color === 'black' && tr === 7))) {
            boardState[tr][tc].isKing = true;
            pieceEl.classList.add('king');
            pieceEl.dataset.isKing = 'true';
            playSound('king');
        }
    }, 480);
}

function getCell(r, c) {
    return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
}

function highlightPossibleMoves(row, col) {
    clearHighlights();
    getCell(row, col).classList.add('selected');
    // Можно расширить для всех возможных ходов
}

function clearHighlights() {
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected','possible','capture'));
}

function aiMove() {
    let bestMove = null;
    let bestScore = -1;

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (!boardState[r][c] || boardState[r][c].color !== 'black') continue;
            for (let tr = 0; tr < 8; tr++) {
                for (let tc = 0; tc < 8; tc++) {
                    const m = getBestValidMove(r, c, tr, tc);
                    if (m.valid) {
                        const score = m.captured.length * 15 + Math.random() * 5;
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove = {fr: r, fc: c, tr, tc, captured: m.captured};
                        }
                    }
                }
            }
        }
    }

    if (bestMove) {
        executeAnimatedMove(bestMove.fr, bestMove.fc, bestMove.tr, bestMove.tc, bestMove.captured);
    }

    if (!checkWin()) {
        currentTurn = 'white';
        document.getElementById('game-status').innerText = "Твой ход (Белые)";
    }
}

function checkWin() {
    let white = 0, black = 0;
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (boardState[r][c]) {
                boardState[r][c].color === 'white' ? white++ : black++;
            }
        }
    }
    if (white === 0) { endGame('black'); return true; }
    if (black === 0) { endGame('white'); return true; }
    return false;
}

function endGame(winner) {
    gameOver = true;
    if (winner === 'white') {
        document.getElementById('game-status').innerText = "🎉 ПОБЕДА!";
        playSound('win');
        createConfetti();
        alert("Великолепно! Ты победил ИИ и получил +30 монет!");
        setTimeout(() => tg.sendData("game_finished"), 1500);
    } else {
        document.getElementById('game-status').innerText = "ИИ победил";
        alert("Компьютер выиграл. Попробуй ещё раз!");
    }
}

function exitGameWithoutReward() {
    document.getElementById('game-container').style.display = 'none';
    document.getElementById('menu-container').style.display = 'block';
}
</script>
</body>
</html>
