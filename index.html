<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровая Панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #181818;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #f39c12;
        }
        .subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .game-card {
            background-color: #242424;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }
        .game-info h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }
        .game-info p {
            margin: 0;
            font-size: 12px;
            color: #2ecc71;
        }
        .play-btn {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .play-btn:hover {
            background-color: #e67e22;
        }
    </style>
</head>
<body>

    <h1>🎮 ИГРОВАЯ ТЕКА</h1>
    <div class="subtitle">Выбирай игру и зарабатывай монеты!</div>

    <div class="game-card">
        <div class="game-info">
            <h2>♟ Шахматы</h2>
            <p> Награда: +50 🪙 за победу</p>
        </div>
        <button class="play-btn" onclick="playGame('Шахматы')">Играть</button>
    </div>

    <div class="game-card">
        <div class="game-info">
            <h2>🔴 Шашки</h2>
            <p> Награда: +30 🪙 за победу</p>
        </div>
        <button class="play-btn" onclick="playGame('Шашки')">Играть</button>
    </div>

    <div class="game-card">
        <div class="game-info">
            <h2>🎲 Нарды</h2>
            <p> Награда: +40 🪙 за победу</p>
        </div>
        <button class="play-btn" onclick="playGame('Нарды')">Играть</button>
    </div>

    <script>
        // Инициализируем WebApp Телеграма
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем окно на весь экран мака/телефона

        function playGame(gameName) {
            alert("Вы запускаете: " + gameName + "!\nЛогика игры будет подключена в следующем шаге.");
        }
    </script>
</body>
</html>
